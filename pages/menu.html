<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cardápio Nota10</title>
  <link rel="stylesheet" href="../src/css/style.css" />
</head>
<body class="page-menu">

  <!-- ── Header fixo ──────────────────────────────────── -->
  <header class="menu-header">
    <div class="menu-header__left">
      <a href="index.html" class="btn-back-home">← Mesas</a>
    </div>
    <div class="menu-header__center">
      <span class="mesa-badge" id="mesa-label">Mesa —</span>
    </div>
    <div class="menu-header__right">
      <button class="btn-servico" id="btn-servico" title="Solicitar atendimento">
        🔔 Atendimento
      </button>
    </div>
  </header>

  <!-- ── Abas de categorias (sticky) ──────────────────── -->
  <nav class="categorias-nav" id="categorias-nav" aria-label="Categorias do cardápio"></nav>

  <main>

    <!-- ── Seção de boas-vindas + cards de categorias ─── -->
    <section class="welcome-section" id="welcome-section">
      <div class="welcome-hero">
        <div class="welcome-hero__emoji">🍽️</div>
        <h2>Bem-vindo!</h2>
        <p>Selecione uma categoria para ver o cardápio</p>
      </div>
      <h3>O que você quer hoje?</h3>
      <div class="categorias-grid" id="categorias-grid"></div>
    </section>

    <!-- ── Seção de itens (oculta inicialmente) ──────── -->
    <section class="itens-section hidden" id="itens-section">
      <div class="itens-header">
        <button id="btn-back-categorias">← Voltar</button>
        <h2 id="categoria-titulo"></h2>
      </div>
      <div class="itens-grid" id="itens-grid"></div>
    </section>

    <!-- ── Status do pedido ativo ─────────────────────── -->
    <section class="pedido-status-section hidden" id="pedido-status-section">
      <h3>📦 Seu pedido</h3>
      <!-- conteúdo renderizado dinamicamente por Orders.renderStatus() -->
    </section>

  </main>

  <!-- ── Overlay e Sidebar do Carrinho ────────────────── -->
  <div class="cart-overlay" id="cart-overlay"></div>

  <aside class="cart-sidebar" id="cart-sidebar" aria-label="Carrinho de compras">
    <div class="cart-header">
      <h3>🛒 Carrinho</h3>
      <button class="btn-close-cart" id="btn-close-cart" aria-label="Fechar carrinho">✕</button>
    </div>

    <div class="cart-body">
      <div class="cart-empty" id="cart-empty">
        <span class="cart-empty__icon">🛒</span>
        <p>Seu carrinho está vazio</p>
        <p style="font-size:.82rem">Adicione itens do cardápio</p>
      </div>
      <div id="cart-items"></div>
    </div>

    <div class="cart-footer" id="cart-footer" style="display:none">
      <div class="cart-total">
        <span>Total do pedido:</span>
        <strong id="cart-total-value">R$ 0,00</strong>
      </div>
      <button class="btn-finalizar" id="btn-finalizar">
        Finalizar Pedido
      </button>
    </div>
  </aside>

  <!-- ── Botão flutuante do carrinho ──────────────────── -->
  <button class="cart-fab" id="cart-fab" aria-label="Abrir carrinho">
    🛒
    <span class="cart-badge hidden" id="cart-badge">0</span>
  </button>

  <!-- Toast notifications -->
  <div id="toast-container" aria-live="polite"></div>

  <!-- Módulos JS — ordem importa (dependências primeiro) -->
  <script src="../src/js/storage.js"></script>
  <script src="../src/js/utils.js"></script>
  <script src="../src/js/menu.js"></script>
  <script src="../src/js/cart.js"></script>
  <script src="../src/js/orders.js"></script>

  <script>
    // Inicialização da página de menu
    document.addEventListener('DOMContentLoaded', () => {
      const mesa = Storage.get(Storage.KEYS.MESA);

      // Guarda de rota: sem mesa identificada, volta para o início
      if (!mesa) {
        Utils.showToast('Escaneie um QR Code para continuar.', 'warning');
        setTimeout(() => { window.location.href = 'index.html'; }, 1500);
        return;
      }

      // Exibe número da mesa no header
      const mesaLabel = document.getElementById('mesa-label');
      if (mesaLabel) mesaLabel.textContent = `Mesa ${mesa}`;
      document.title = `Mesa ${mesa} — Cardápio Nota10`;

      // Inicia módulos
      Menu.init();
      Cart.init();
      Orders.init(mesa);

      // Botão de solicitar atendimento
      document.getElementById('btn-servico')?.addEventListener('click', () => {
        Orders.requestService(mesa);
      });

      // Polling de atualização do status do pedido (a cada 5s)
      Orders.startPolling(mesa);
    });
  </script>
</body>
</html>
