<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Sistema de pedidos — Selecione sua mesa" />
  <title>Sabor & Arte — Escaneie sua mesa</title>
  <link rel="stylesheet" href="../src/css/style.css" />
</head>
<body class="page-qr">

  <div class="qr-page">

    <!-- ── Header ─────────────────────────────────────── -->
    <header class="qr-header">
      <div class="qr-logo">🍽️</div>
      <h1 class="qr-restaurant-name">Sabor &amp; Arte</h1>
      <p class="qr-tagline">Cardápio digital · Peça na mesa</p>
    </header>

    <!-- ── Banner de sessão existente ─────────────────── -->
    <div class="session-banner hidden" id="session-banner">
      <p>Você já tem uma sessão ativa na <strong>Mesa <span id="session-mesa"></span></strong>.</p>
      <div class="session-actions">
        <button class="btn-return" id="btn-return-session">Continuar pedido</button>
        <button class="btn-new-session" id="btn-new-session">Nova sessão</button>
      </div>
    </div>

    <!-- ── Instruções ──────────────────────────────────── -->
    <div class="qr-instructions">
      <div class="instruction-step">
        <span class="step-num">1</span>
        <span>Encontre o QR Code colado na sua mesa</span>
      </div>
      <div class="instruction-step">
        <span class="step-num">2</span>
        <span>Clique no QR Code correspondente abaixo</span>
      </div>
      <div class="instruction-step">
        <span class="step-num">3</span>
        <span>Escolha seus itens e faça seu pedido!</span>
      </div>
    </div>

    <!-- ── Grade de QR Codes (renderizada pelo JS) ────── -->
    <p class="qr-section-title">Selecione sua mesa</p>
    <div class="qr-grid" id="qr-grid" role="list"></div>

    <!-- ── Link para admin ────────────────────────────── -->
    <p class="qr-admin-link">
      Funcionário? <a href="admin.html">Acessar painel do estabelecimento →</a>
    </p>

  </div>

  <!-- Toast notifications -->
  <div id="toast-container" aria-live="polite"></div>

  <script src="../src/js/storage.js"></script>
  <script src="../src/js/utils.js"></script>
  <script src="../src/js/app.js"></script>
</body>
</html>
